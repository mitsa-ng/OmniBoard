services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: omniboard
      POSTGRES_USER: omniboard
      POSTGRES_PASSWORD: omniboard_dev_password
    ports:
      - "5432:5432"
    volumes:
      - omniboard_postgres:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U omniboard -d omniboard"]
      interval: 5s
      timeout: 5s
      retries: 10

  backend:
    build:
      context: ./backend
    environment:
      DATABASE_URL: postgres://omniboard:omniboard_dev_password@postgres:5432/omniboard
      SYNC_API_KEY: OmniBoard_Local_Development_Secret
      ALLOWED_WEB_ORIGIN: http://localhost:5173,http://localhost:5174,http://127.0.0.1:5173,http://127.0.0.1:5174
      PUBLIC_CACHE_MAX_AGE_SECONDS: 60
      PORT: 3000
      RUST_LOG: omniboard_backend=info,tower_http=info
    ports:
      - "3000:3000"
    depends_on:
      postgres:
        condition: service_healthy

volumes:
  omniboard_postgres:

services:
  - type: web
    name: omniboard-backend
    runtime: docker
    repo: https://github.com/mitsa-ng/OmniBoard
    dockerfilePath: ./Dockerfile
    envVars:
      - key: DATABASE_URL
        sync: false
      - key: SYNC_API_KEY
        sync: false
      - key: ALLOWED_WEB_ORIGIN
        value: https://omniboard-app.vercel.app,http://localhost:5174,https://tauri.localhost,tauri://localhost
      - key: PUBLIC_CACHE_MAX_AGE_SECONDS
        value: "60"
      - key: PORT
        value: "3000"
      - key: RUST_LOG
        value: omniboard_backend=info,tower_http=info
    healthCheckPath: /health
